Number(h.interest))&&Number(h.interest)>=0)events.push({date:h.date,interest:Number(h.interest),received:Number(h.received)||0,kind:h.kind||'Pagamento'})}for(const h of (l.renewalHistory||[])){if(h.date)events.push({date:h.date,interest:Number(h.interestPaid)||0,received:Number(h.received)||0,kind:'Renovação'})}}return events}function profitSummary(year){const events=paymentLedger().filter(h=>h.date.slice(0,4)===String(year));let monthly=Array(12).fill(0);for(const h of events){const m=Number(h.date.slice(5,7));if(m>=1&&m<=12)monthly[m-1]+=h.interest}return monthly.map(v=>Math.round(v*100)/100)}function legacyProfitWarning(){return db.loans.some(l=>l.installments.some(p=>(Number(p.paid)||0)>0)||(l.partialHistory||[]).length>0||(l.calendarPaymentHistory||[]).length>0)&&db.loans.some(l=>l.installments.some(p=>(Number(p.paid)||0)>0))}function recordProfit(l,value,kind,interest){l.profitLedger=l.profitLedger||[];l.profitLedger.push({id:id(),date:today(),received:+value.toFixed(2),interest:+Math.max(0,interest).toFixed(2),kind})}function allocateInterest(l,p,value){let total=Number(l.amount)+Number(l.interest);if(!(total>0))return 0;let target=(Number(p.amount)||0)*(Number(l.interest)||0)/total;let paidBefore=Number(p.paid)||0;let before=Math.min(target,paidBefore*(Number(l.interest)||0)/total);let after=Math.min(target,(paidBefore+value)*(Number(l.interest)||0)/total);return Math.max(0,+(after-before).toFixed(2))}function renderProfit(){const year=Number(profitYear)||new Date().getFullYear(),monthly=profitSummary(year),total=monthly.reduce((a,b)=>a+b,0),names=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];return shell('Meu lucro mensal e anual',`<div class="row no-print"><label for="profitYear">Ano</label><select id="profitYear" style="width:140px" onchange="profitYear=this.value;render()">${Array.from({length:7},(_,i)=>new Date().getFullYear()+1-i).map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}</select></div><div class="home-stats"><div class="home-stat green">Lucro recebido no ano<strong>${money(total)}</strong></div><div class="home-stat amber">Lucro neste mês<strong>${money(year===new Date().getFullYear()?monthly[new Date().getMonth()]:0)}</strong></div></div><div class="report-scroll"><table class="report-table"><thead><tr><th>Mês</th><th>Juros recebidos (lucro bruto)</th></tr></thead><tbody>${names.map((n,i)=>`<tr><td>${n}</td><td>${money(monthly[i])}</td></tr>`).join('')}</tbody><tfoot><tr><th>Total anual</th><th>${money(total)}</th></tr></tfoot></table></div><p class="report-note">Mostra juros efetivamente recebidos, não o capital devolvido. É lucro bruto, sem descontar despesas, impostos ou perdas. Pagamentos anteriores a esta atualização que não tinham data e composição de juros registrada não podem ser distribuídos com segurança por mês; por isso não são estimados aqui.</p><div class="report-actions no-print"><button class="btn" onclick="window.print()">🖨️ Imprimir / PDF</button><button class="btn secondary" onclick="nav('home')">Voltar ao Início</button></div>`)}

// Caixa v15: saldo inicial independente do histórico antigo. Os dados existentes são preservados.
function cashState(){if(!db.cash||typeof db.cash!=='object')db.cash={initialized:false,opening:0,movements:[],snapshot:{}};db.cash.movements=db.cash.movements||[];db.cash.snapshot=db.cash.snapshot||{};return db.cash}
function loanPaidValue(l){return (l.installments||[]).reduce((v,p)=>v+(Number(p.paid)||0),0)+(l.renewalHistory||[]).reduce((v,h)=>v+(Number(h.received)||0),0)}
function loanSnapshot(){let o={};for(const l of db.loans)o[l.id]={amount:Number(l.amount)||0,paid:loanPaidValue(l)};return o}
function cashBalance(){const c=cashState();return (Number(c.opening)||0)+c.movements.reduce((v,m)=>v+(Number(m.amount)||0),0)}
function cashMove(amount,description,category,kind='manual'){const c=cashState();c.movements.unshift({id:id(),date:today(),amount:Math.round(amount*100)/100,description,category,kind});}
function syncCashLoans(){const c=cashState();if(!c.initialized)return;const before=c.snapshot||{},after=loanSnapshot();for(const l of db.loans){const old=before[l.id],now=after[l.id];if(!old){cashMove(-now.amount,'Empréstimo • '+(db.clients.find(x=>x.id===l.clientId)?.name||'Cliente'),'Empréstimos','loan');if(now.paid>0)cashMove(now.paid,'Recebimento • empréstimo novo','Empréstimos','payment')}else if(now.paid>old.paid+.005){cashMove(now.paid-old.paid,'Recebimento • '+(db.clients.find(x=>x.id===l.clientId)?.name||'Cliente'),'Empréstimos','payment')}else if(now.paid<old.paid-.005){cashMove(now.paid-old.paid,'Estorno de recebimento • '+(db.clients.find(x=>x.id===l.clientId)?.name||'Cliente'),'Empréstimos','adjustment')}}c.snapshot=after}
const oldSave=save;save=function(){syncCashLoans();oldSave()};
function cashSetup(){let v=prompt('Quanto você tem disponível hoje no caixa? (R$)\nOs empréstimos já cadastrados serão considerados dinheiro na praça, sem nova saída.');if(v===null)return;v=Number(v.trim().replace(/\./g,'').replace(',','.'));if(!Number.isFinite(v)||v<0)return alert('Informe um valor válido.');const c=cashState();if(c.initialized)return alert('Caixa já iniciado. Use ajuste de saldo.');c.opening=v;c.initialized=true;c.snapshot=loanSnapshot();save();render()}
function cashAdd(kind){let desc=prompt(kind==='in'?'Descrição da entrada:':kind==='card'?'Descrição da compra no crédito:':'Descrição da despesa:');if(desc===null)return;desc=desc.trim();if(!desc)return alert('Informe uma descrição.');let raw=prompt('Valor em R$:', '100,00');if(raw===null)return;let v=Number(raw.trim().replace(/\./g,'').replace(',','.'));if(!Number.isFinite(v)||v<=0)return alert('Valor inválido.');let category=kind==='card'?'Cartões':prompt('Categoria (Pessoal, Empréstimos, Trabalho, Outros):',kind==='in'?'Outros':'Pessoal');if(category===null)return;category=category.trim()||'Outros';if(kind==='card'){const c=cashState();c.cards=c.cards||[];c.cards.push({id:id(),description:desc,amount:v,date:today(),paid:false});save();render();return}cashMove(kind==='in'?v:-v,desc,category);save();render()}

function renewPreview(){let l=db.loans.find(x=>x.id===loanId),value=Number($('renewValue')?.value),box=$('renewResult');if(!box)return;if(!(value>0&&value<=loanTotal(l)+.005)){box.textContent='Informe um valor maior que zero, até o total devido.';return}let x=renewalCalc(l,value,$('renewCarry').value);box.innerHTML=`<b>Prévia após o recebimento</b><p>Juros pagos: <b>${money(x.paidInterest)}</b></p><p>Capital abatido: <b>${money(x.capitalPaid)}</b></p><p>Juros que faltaram: <b>${money(x.shortfall)}</b></p><hr><p>Novo capital: <b>${money(x.paidOff?0:x.nextCapital)}</b></p><p>Próximos juros: <b>${money(x.paidOff?0:x.nextInterest+x.pending)}</b></p><p>Próximo total: <b>${money(x.paidOff?0:x.nextCapital+x.nextInterest+x.pending)}</b></p>${x.paidOff?'<p><b>Empréstimo quitado.</b></p>':`<p>Próximo vencimento: <b>${date($('renewDate').value)}</b></p>`}`}
function confirmRenew(){let l=db.loans.find(x=>x.id===loanId);if(!l||l.freq!=='monthly'||l.installments.length!==1)return;let p=l.installments[0];if(!l.renewalMode&&p.paid>0)return alert('Já há recebimentos nesta parcela; renovação bloqueada para evitar duplicidade.');let value=Number($('renewValue').value),carry=$('renewCarry').value,next=$('renewDate').value;if(!Number.isFinite(value)||value<=0||value>loanTotal(l)+.005)return alert('Confira o valor recebido.');if(!next||next<=p.date)return alert('O próximo vencimento deve ser posterior ao atual.');let x=renewalCalc(l,value,carry);if(carry==='capital'&&x.shortfall>0&&!confirm('Atenção: acrescentar juros não pagos ao capital pode ser proibido ou limitado. Confirma que isso está permitido no contrato?'))return;let msg=`Recebido: ${money(value)}\nJuros pagos: ${money(x.paidInterest)}\nCapital abatido: ${money(x.capitalPaid)}\nNovo capital: ${money(x.paidOff?0:x.nextCapital)}\nJuros pendentes: ${money(x.paidOff?0:x.pending)}\n${x.paidOff?'Empréstimo quitado':'Próximo vencimento: '+date(next)}\n\nConfirmar registro?`;if(!confirm(msg))return;l.renewalHistory=l.renewalHistory||[];l.renewalHistory.push({date:today(),dueDate:p.date,received:+value.toFixed(2),interestPaid:x.paidInterest,capitalPaid:x.capitalPaid,nextCapital:x.paidOff?0:x.nextCapital,pending:x.paidOff?0:x.pending,carry});l.renewalMode=true;l.amount=x.paidOff?0:x.nextCapital;l.interest=x.paidOff?0:x.nextInterest;l.pendingInterest=x.paidOff?0:x.pending;p.date=x.paidOff?p.date:next;p.amount=x.paidOff?0:+(l.amount+l.interest+l.pendingInterest).toFixed(2);p.paid=0;p.interestPaid=0;save();nav('loan',l.clientId,l.id);alert(x.paidOff?'Quitação registrada com sucesso.':'Pagamento registrado e vencimento renovado. Faça um backup dos dados.')}
function calendarReceive(lid,i,full){let l=db.loans.find(x=>x.id===lid);if(!l)return;let p=l.installments[i];if(!p)return;let remaining=Math.round((p.amount-(p.paid||0))*100)/100;if(remaining<=0)return alert('Esta parcela já está paga.');if(l.renewalMode)return alert('Empréstimo com renovação ativa: consulte o detalhe para evitar duplicidade.');let raw=full?String(remaining):prompt('Valor recebido (R$) · Vencimento '+date(p.date),remaining.toFixed(2));if(raw===null)return;let value=Number(String(raw).replace(',','.'));if(!Number.isFinite(value)||value<=0||Math.round(value*100)>Math.round(remaining*100))return alert('Valor inválido ou maior que o saldo da parcela.');if(!confirm('Registrar '+money(value)+' recebido em '+date(today())+' para a parcela de '+date(p.date)+'?'))return;let earned=allocateInterest(l,p,value);p.paid=Math.round(((p.paid||0)+value)*100)/100;p.interestPaid=Math.round(((p.interestPaid||0)+earned)*100)/100;recordProfit(l,value,'Calendário',earned);l.calendarPaymentHistory=l.calendarPaymentHistory||[];l.calendarPaymentHistory.push({installmentId:p.id,dueDate:p.date,date:today(),received:value});save();render();alert('Pagamento registrado! A parcela permanece no dia do vencimento.')}function calendarRenew(lid){let l=db.loans.find(x=>x.id===lid);if(!l)return;if(l.agreement)return alert('Acordo sem juros: use pagamento parcial ou receber tudo. Não há juros para renovar.');if(l.freq==='monthly'&&l.installments.length===1){nav('renew',l.clientId,l.id);return}alert('Renovação diária/semanal: a tela está prevista, mas o cálculo seguro de renovação ainda não foi implementado. Nenhuma cobrança foi alterada.');}function shiftCalendar(step){let [y,m]=calendarMonth.split('-').map(Number),d=new Date(y,m-1+step,1);calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');calendarDay=1;render()}function previewLoan(){let a=+$('amount').value||0,p=+$('interest').value||0,n=+$('count').value||0;let el=$('preview');if(el)el.textContent='Juros: '+money(a*p/100)+' • Total: '+money(a*(1+p/100))+' • Parcela: '+(n>0?money(a*(1+p/100)/n):'—')}function drawClients(){let q=($('search')?.value||'').toLocaleLowerCase('pt-BR'),list=db.clients.filter(c=>c.name.toLocaleLowerCase('pt-BR').includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));$('clientsList').innerHTML=list.length?list.map(c=>{let loans=db.loans.filter(l=>l.clientId===c.id&&!l.archivedByAgreement),sum=loans.reduce((v,l)=>v+loanTotal(l),0);return `<button class="client-compact" onclick="nav('client','${c.id}')"><span><b>${esc(c.name)}</b><small>${loans.length} empréstimo(s)</small></span><span class="client-total"><b>${money(sum)}</b><small>Consultar situação ›</small></span></button>`}).join(''):'<p class="muted">Nenhum cliente encontrado. Toque em Novo empréstimo para cadastrar.</p>'}function addDate(start,n,f,days='all'){let [y,m,dd]=start.split('-').map(Number),d=new Date(y,m-1,dd,12);if(f==='daily'){for(let i=0;i<n;i++){do{d.setDate(d.getDate()+1)}while((days==='mon-sat'&&d.getDay()===0)||(days==='mon-fri'&&(d.getDay()===0||d.getDay()===6)))}}else if(f==='weekly')d.setDate(d.getDate()+n*7);else{let day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);let last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last))}return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function createAgreement(e){e.preventDefault();let c=db.clients.find(x=>x.id===clientId);if(!c)return;let amt=Number($('agreementAmount').value),count=Number($('agreementCount').value),freq=$('agreementFreq').value,first=$('agreementFirst').value;if(!Number.isFinite(amt)||amt<=0||!Number.isInteger(count)||count<1||count>365||!first)return alert('Confira os dados do acordo.');let olds=db.loans.filter(l=>l.clientId===c.id&&!l.archivedByAgreement&&due(l)>.005),oldSum=olds.reduce((v,l)=>v+due(l),0);if(!confirm('Criar acordo sem juros de '+money(amt)+' em '+count+' parcelas?'+(olds.length?'\n\nSerão arquivados '+olds.length+' empréstimo(s) abertos, com saldo de '+money(oldSum)+'. O histórico ficará preservado no backup, mas suas cobranças antigas deixarão de aparecer no calendário e no saldo atual.':'')+'\n\nFaça um backup antes de continuar.'))return;let cents=Math.round(amt*100),base=Math.floor(cents/count),rem=cents%count;let installments=Array.from({length:count},(_,i)=>({id:id(),date:i===0?first:addDate(first,i,freq,'all'),amount:(base+(i<rem?1:0))/100,paid:0,interestPaid:0}));let lid=id();for(const l of olds)l.archivedByAgreement=lid;db.loans.push({id:lid,clientId:c.id,amount:amt,interest:0,interestPercent:0,agreement:true,created:today(),freq,days:'all',penalty:'none',penaltyValue:0,installments,originalLoanIds:olds.map(l=>l.id),originalOpenBalance:oldSum});save();nav('client',c.id);alert('Acordo registrado! Juros adicionais: R$ 0,00.');}
function createLoan(e){e.preventDefault();let cid=$('clientSelect').value;if(cid==='new'){let name=$('newName').value.trim();if(!name)return alert('Informe o nome');let existing=db.clients.find(c=>c.name.toLowerCase()===name.toLowerCase());if(existing)cid=existing.id;else{cid=id();db.clients.push({id:cid,name})}}let amount=+$('amount').value,interest=Math.round(amount*(+$('interest').value)/100*100)/100,count=+$('count').value,first=$('start').value,freq=$('freq').value,days=$('days').value;if(!(amount>0&&count>0&&count<=365))return alert('Confira os valores');let total=Math.round((amount+interest)*100),base=Math.floor(total/count),rem=total%count;let installments=Array.from({length:count},(_,i)=>({id:id(),date:addDate(first,i,freq,days),amount:(base+(i<rem?1:0))/100,paid:0,interestPaid:0}));let l={id:id(),clientId:cid,amount,interest,created:today(),freq,days,interestPercent:+$('interest').value,penalty:$('penalty').value,penaltyValue:+$('penaltyValue').value,installments};db.loans.push(l);save();nav('client',cid)}function renameClient(){let c=db.clients.find(c=>c.id===clientId),name=prompt('Novo nome do cliente',c.name);if(name?.trim()){c.name=name.trim();save();render()}}function deleteClient(){if(!confirm('Excluir cliente e TODOS os empréstimos dele? Esta ação não pode ser desfeita.'))return;db.loans=db.loans.filter(l=>l.clientId!==clientId);db.clients=db.clients.filter(c=>c.id!==clientId);save();nav('clients')}function deleteLoan(){let current=db.loans.find(l=>l.id===loanId);if(current?.agreement&&db.loans.some(l=>l.archivedByAgreement===loanId))return alert('Este acordo substituiu empréstimos antigos. Excluir exigiria reativar as dívidas anteriores; operação bloqueada para evitar perda ou duplicidade.');if(!confirm('Excluir este empréstimo e seus pagamentos?'))return;db.loans=db.loans.filter(l=>l.id!==loanId);save();nav('client',clientId)}function editLoan(){let l=db.loans.find(l=>l.id===loanId);if(l.renewalMode)return alert('Empréstimo com renovações: edição bloqueada para proteger o histórico.');if(l.installments.some(p=>p.paid>0))return alert('Este empréstimo já tem recebimentos. Para preservar o histórico, edite somente parcelas ainda não pagas em uma próxima versão.');let amt=prompt('Novo capital (R$)',l.amount),intr=prompt('Novos juros totais (R$)',l.interest);if(amt===null||intr===null)return;amt=Number(amt.replace(',','.'));intr=Number(intr.replace(',','.'));if(!(amt>0&&intr>=0))return alert('Valores inválidos');l.amount=amt;l.interest=intr;let cents=Math.round((amt+intr)*100),base=Math.floor(cents/l.installments.length),rem=cents%l.installments.length;l.installments.forEach((p,i)=>p.amount=(base+(i<rem?1:0))/100);save();render()}function receive(lid,i){let l=db.loans.find(l=>l.id===lid);if(l.renewalMode)return alert('Use Receber e renovar para preservar o histórico deste empréstimo.');let p=l.installments[i],remaining=Math.max(0,p.amount-p.paid);let raw=prompt('Valor recebido (R$)',remaining.toFixed(2));if(raw===null)return;let value=Number(raw.replace(',','.'));if(!(value>0&&value<=remaining+.005))return alert('Informe um valor válido até o saldo da parcela');let interestOnly=l.agreement?false:confirm('Este recebimento é SOMENTE DE JUROS?\nOK = Só juros\nCancelar = Pagamento normal');if(interestOnly){p.interestPaid=Math.round(((p.interestPaid||0)+value)*100)/100;p.interestOnlyExtra=Math.round(((p.interestOnlyExtra||0)+value)*100)/100;recordProfit(l,value,'Somente juros',value)}else{let earned=allocateInterest(l,p,value);p.paid=Math.round((p.paid+value)*100)/100;p.interestPaid=Math.round(((p.interestPaid||0)+Math.min(value,Math.max(0,p.amount*(l.interest/(l.amount+l.interest))-(p.interestPaid||0))))*100)/100;recordProfit(l,value,'Parcela',earned)}save();render()}function toggleDays(){let el=$('daysBox');if(el)el.classList.toggle('hidden',$('freq').value!=='daily')}function togglePenalty(){let el=$('penaltyBox');if(el)el.classList.toggle('hidden',$('penalty').value==='none')}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(!Array.isArray(obj.clients)||!Array.isArray(obj.loans))throw Error('Formato inválido');if(!confirm('Importar este backup e substituir todos os dados atuais?'))return;db={clients:obj.clients,loans:obj.loans};save();nav('home');alert('Backup importado.')}catch(err){alert('Não foi possível importar: '+err.message)}};r.readAsText(f)}function backup(){let blob=new Blob([JSON.stringify({version:14.3,exportedAt:new Date().toISOString(),...db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='emprestimos-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
/* v15.1 - contas individuais com caixa consolidado */
const oldCashStateV151=cashState;
cashState=function(){
 const c=oldCashStateV151();
 if(!Array.isArray(c.accounts)) c.accounts=[];
 if(!c.accounts.length && c.initialized){
   c.accounts=[{id:'principal',name:'Saldo anterior / a distribuir',opening:Number(c.opening)||0}];
   (c.movements||[]).forEach(m=>{if(!m.accountId)m.accountId='principal'});
 }
 return c;
};
function bankBalance(a){return (Number(a.opening)||0)+cashState().movements.filter(m=>m.accountId===a.id).reduce((t,m)=>t+(Number(m.amount)||0),0)}
function accountSelect(question){
 const c=cashState();
 if(!c.accounts.length){alert('Cadastre primeiro uma conta em Saldo por banco.');return null}
 const options=c.accounts.map((a,i)=>`${i+1}. ${a.name} (${money(bankBalance(a))})`).join('\n');
 const raw=prompt(question+'\n'+options+'\nInforme o número:', '1');
 if(raw===null)return null;
 const a=c.accounts[Number(raw)-1];if(!a){alert('Conta inválida');return null}return a;
}
const originalCashMoveV151=cashMove;
cashMove=function(amount,description,category,kind='manual'){
 const c=cashState();
 const a=accountSelect('Selecione a conta para: '+description);
 if(!a)return false;
 originalCashMoveV151(amount,description,category,kind);
 c.movements[0].accountId=a.id;
 return true;
};
const originalCashSetupV151=cashSetup;
cashSetup=function(){
 const c=cashState();
 if(c.initialized)return originalCashSetupV151();
 const name=prompt('Nome do primeiro banco ou conta (ex.: Nubank, Itaú, Dinheiro):','Conta principal');
 if(name===null||!name.trim())return;
 const raw=prompt('Saldo atual nessa conta (R$):','0,00');
 if(raw===null)return;
 const n=Number(raw.replace(/\./g,'').replace(',','.'));
 if(!Number.isFinite(n)||n<0)return alert('Saldo inválido');
 c.opening=n;c.initialized=true;c.snapshot=loanSnapshot();
 c.accounts=[{id:id(),name:name.trim(),opening:n}];save();render();
 alert('Primeira conta cadastrada. Em "Saldo por banco" você pode adicionar as demais.');
};
function addBank(){
 const name=prompt('Nome do banco ou conta:');if(!name||!name.trim())return;
 const raw=prompt('Saldo inicial dessa conta (R$):','0,00');if(raw===null)return;
 const n=Number(raw.replace(/\./g,'').replace(',','.'));
 if(!Number.isFinite(n)||n<0)return alert('Saldo inválido');
 const c=cashState();c.accounts.push({id:id(),name:name.trim(),opening:n});c.opening=Math.round((Number(c.opening)+n)*100)/100;save();render();
}
function transferBank(){
 const from=accountSelect('Transferir DE qual conta?');if(!from)return;
 const to=accountSelect('Transferir PARA qual conta?');if(!to||to.id===from.id)return;
 const raw=prompt('Valor da transferência (R$):','100,00');if(raw===null)return;
 const n=Number(raw.replace(/\./g,'').replace(',','.'));
 if(!(n>0)||n>bankBalance(from)+0.005)return alert('Valor inválido ou saldo insuficiente');
 const c=cashState(),tx=id();
 c.movements.unshift({id:id(),date:today(),amount:-n,description:'Transferência para '+to.name,category:'Transferência',kind:'transfer',accountId:from.id,transferId:tx});
 c.movements.unshift({id:id(),date:today(),amount:n,description:'Transferência de '+from.name,category:'Transferência',kind:'transfer',accountId:to.id,transferId:tx});
 save();render();
}
function bankDetails(){
 const c=cashState();
 const rows=c.accounts.map(a=>`<div class="cash-item"><div><b>${esc(a.name)}</b><small>Saldo da conta</small></div><b>${money(bankBalance(a))}</b></div>`).join('');
 return `<section class="panel"><h2>🏦 Saldo por banco</h2><div class="cash-hero"><small>SALDO TOTAL DISPONÍVEL</small><strong>${money(cashBalance())}</strong></div>${rows}<div class="cash-nav"><button class="btn secondary" onclick="addBank()">＋ Adicionar banco</button><button class="btn secondary" onclick="transferBank()">⇄ Transferir entre bancos</button></div><p class="cash-note">As transferências não alteram o saldo geral. Valores de empréstimos antigos continuam separados do caixa.</p><button class="btn secondary" onclick="nav('cash')">← Voltar ao caixa</button></section>`;
}
const originalRenderCashV151=renderCash;
renderCash=function(){
 let html=originalRenderCashV151();
 if(cashState().initialized)html=html.replace('</div><div class="cash-grid">','<button class="btn secondary" style="margin-top:12px" onclick="nav(\'banks\')">Ver saldo por banco ›</button></div><div class="cash-grid">');
 return html;
};
const originalRenderV151=render;
render=function(){
 if(page==='banks'){
   const old=page;page='cash';originalRenderV151();page=old;
   const panel=document.querySelector('#app');
   if(panel)panel.innerHTML=bankDetails();
   return;
 }
 originalRenderV151();
};

render();
